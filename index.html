<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>確定申告・税金フロー診断</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl p-6 md:p-8">
        <!-- ヘッダー -->
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h1 class="text-xl font-bold text-indigo-600">確定申告フロー診断ツール</h1>
            </div>
            <div class="flex items-center gap-2">
                <!-- 戻るボタン -->
                <button id="back-btn" onclick="goBack()" class="text-xs px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition hidden">← 戻る</button>
                <span id="auth-status" class="text-xs px-2 py-1 bg-amber-100 text-amber-800 rounded-full">接続中...</span>
            </div>
        </div>

        <!-- 質問コンテナ -->
        <div id="quiz-container">
            <div id="question-text" class="text-lg font-medium mb-6">読み込み中...</div>
            
            <!-- ① 収入・経費などの自由入力フィールド（事業・業務委託用） -->
            <div id="biz-input-container" class="mb-6 hidden space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                <p class="text-xs text-slate-500 font-medium">売上と経費を入力すると、基礎控除（令和8年基準）と比較して自動判定します（未入力でも次へ進めます）</p>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">年間売上・収入（円）</label>
                    <input type="number" id="biz-income-input" placeholder="例: 1200000" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">年間経費（円）</label>
                    <input type="number" id="biz-expense-input" placeholder="例: 300000" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white">
                </div>
                <button onclick="submitBizInputs()" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">この金額で自動判定して次へ</button>
            </div>

            <!-- ② 学生の給与収入などの自由入力フィールド -->
            <div id="input-container" class="mb-6 hidden">
                <label id="input-label" class="block text-sm font-medium text-slate-600 mb-2"></label>
                <div class="flex gap-2">
                    <input type="number" id="custom-number-input" placeholder="例: 1300000" class="flex-1 p-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="submitCustomInput()" class="bg-indigo-600 text-white px-5 py-3 rounded-xl hover:bg-indigo-700 font-medium transition">次へ</button>
                </div>
                <p class="text-xs text-slate-400 mt-1">※空欄のままでも進めます</p>
            </div>

            <!-- 選択肢ボタンコンテナ -->
            <div id="options-container" class="space-y-3">
                <!-- 動的にボタンが生成されます -->
            </div>
        </div>

        <!-- やり直しボタン -->
        <div class="mt-8 text-center">
            <button onclick="resetQuiz()" class="text-sm text-slate-400 hover:text-slate-600 underline">最初からやり直す</button>
        </div>

        <!-- 結果表示エリア -->
        <div id="result-container" class="mt-8 p-4 bg-indigo-50 rounded-xl border border-indigo-100 hidden">
            <h2 class="text-sm font-bold text-indigo-700 uppercase tracking-wider mb-1">診断結果・アドバイス</h2>
            <div id="result-content" class="text-slate-700 text-sm leading-relaxed"></div>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // TODO: ご自身のFirebaseコンフィグに書き換えてください
        // ==========================================
        const firebaseConfig = {
        apiKey: "AIzaSyDduIy-yScms9PIhzYL_xELUENCtxhJLgo",
        authDomain: "kakueisinnkoku.firebaseapp.com",
        projectId: "kakueisinnkoku",
        storageBucket: "kakueisinnkoku.firebasestorage.app",
        messagingSenderId: "816689506261",
        appId: "1:816689506261:web:1b4802d9345ba83e97bf5c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserUid = null;
        let userAnswers = {};
        let historyStack = []; // 戻る機能のための履歴スタック

        // 匿名認証
        signInAnonymously(auth)
            .then((userCredential) => {
                currentUserUid = userCredential.user.uid;
                document.getElementById('auth-status').innerText = "クラウド保存有効";
                document.getElementById('auth-status').className = "text-xs px-2 py-1 bg-emerald-100 text-emerald-800 rounded-full";
                loadUserData(currentUserUid);
            })
            .catch((error) => {
                console.error("認証エラー:", error);
                document.getElementById('auth-status').innerText = "オフラインモード";
            });

        async function saveToCloud(key, value) {
            userAnswers[key] = value;
            if (!currentUserUid) return;
            try {
                const docRef = doc(db, "tax_diagnosis", currentUserUid);
                await setDoc(docRef, {
                    answers: userAnswers,
                    updatedAt: new Date()
                }, { merge: true });
            } catch (e) {
                console.error("保存失敗: ", e);
            }
        }

        async function loadUserData(uid) {
            try {
                const docRef = doc(db, "tax_diagnosis", uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.answers && data.answers.currentStep) {
                        userAnswers = data.answers;
                        if(data.answers.history) {
                            historyStack = data.answers.history;
                        }
                    }
                }
            } catch (e) {
                console.error("ロード失敗:", e);
            }
            showStep(userAnswers.currentStep || 'q1', false);
        }

        // ==========================================
        // 質問ツリー定義
        // ==========================================
        const quizTree = {
            'q1': {
                text: "Q1. あなたの主な収入はどれですか？",
                options: [
                    { label: "① 収入なし", next: "q_none_1" },
                    { label: "② 主に給与 (アルバイト・正社員など)", next: "q_salary_1" },
                    { label: "③ 主に公的年金", next: "q_pension_1" },
                    { label: "④ 主に営業・農業・不動産・業務委託（フリーランス）", next: "q_biz_input_step" }
                ]
            },

            // --- ① 収入なし ---
            'q_none_1': {
                text: "市内の親族の扶養に入っていますか？",
                options: [
                    { label: "はい", next: "result_D_fuyo" },
                    { label: "いいえ", next: "result_C" }
                ]
            },

            // --- ② 主に給与 ---
            'q_salary_1': {
                text: "給与の年間収入が2,000万円を超えていますか？",
                options: [
                    { label: "はい", next: "result_A" },
                    { label: "いいえ", next: "q_salary_2" }
                ]
            },
            'q_salary_2': {
                text: "勤務先は1か所のみで、年末調整をしていますか？（複数あっても年末調整で合算している場合は「はい」）",
                options: [
                    { label: "はい", next: "q_salary_3" },
                    { label: "いいえ", next: "result_A" }
                ]
            },
            'q_salary_3': {
                text: "給与・退職所得以外の所得（副業の業務委託や、株の利益など）がありますか？",
                options: [
                    { label: "はい", next: "q_side_income_type" },
                    { label: "いいえ", next: "q_is_student" }
                ]
            },

            'q_side_income_type': {
                text: "給与以外にある「副業の業務委託」や「株の利益」について当てはまるものは？",
                options: [
                    { label: "副業の業務委託（ライティング・開発など）の所得がある", next: "q_salary_4_biz" },
                    { label: "株の売却益や配当などの投資利益がある", next: "q_stock_check" },
                    { label: "両方ある、またはその他の所得がある", next: "q_salary_4" }
                ]
            },

            'q_salary_4_biz': {
                text: "副業（業務委託）の「年間所得（収入から経費を引いた額）」が 20万円 を超えていますか？",
                options: [
                    { label: "はい（20万円超 → 確定申告が必要）", next: "result_A_side_biz" },
                    { label: "いいえ（20万円以下 → 所得税は不要ですが住民税申告に注意）", next: "result_B_resident_only" }
                ]
            },

            'q_stock_check': {
                text: "株の取引をしている証券口座の種類や状況は？",
                options: [
                    { label: "特定口座（源泉徴収あり）である", next: "result_stock_with_tax" },
                    { label: "特定口座（源泉徴収なし）または一般口座である", next: "result_A" },
                    { label: "損益通算や損失の繰越控除、配当控除を受けたい", next: "result_A_stock_refund" }
                ]
            },

            'q_salary_4': {
                text: "給与所得以外の各種所得の合計が 20万円 を超えていますか？",
                options: [
                    { label: "はい", next: "result_A" },
                    { label: "いいえ", next: "result_B_resident_only" }
                ]
            },

            'q_is_student': {
                text: "あなたは現在、学生（勤労学生控除の対象になる立場）ですか？",
                options: [
                    { label: "はい（学生です）", next: "q_student_amount" },
                    { label: "いいえ（学生ではありません）", next: "result_no_tax_need" }
                ]
            },

            'q_student_amount': {
                text: "あなたの現在の「年間給与収入」はおよそいくらですか？（金額を入力するか、下の目安を選んでください）",
                inputType: "annualIncome",
                inputLabel: "年間給与収入（円）の入力",
                options: [
                    { label: "110万円以下", next: "result_stu_low" },
                    { label: "110万〜134万円", next: "result_stu_mid1" },
                    { label: "134万〜163万円（※R8改正の学生控除上限内）", next: "result_stu_mid2" },
                    { label: "163万円超（扶養や健康保険に注意）", next: "result_stu_high" }
                ]
            },

            // --- ③ 主に公的年金 ---
            'q_pension_1': {
                text: "年金収入が400万円を超えていますか？",
                options: [
                    { label: "はい", next: "result_A" },
                    { label: "いいえ", next: "q_pension_2" }
                ]
            },
            'q_pension_2': {
                text: "年金以外の所得がありますか？",
                options: [
                    { label: "はい", next: "q_pension_3" },
                    { label: "いいえ", next: "q_pension_check65" }
                ]
            },
            'q_pension_3': {
                text: "年金以外の所得が20万円を超えていますか？",
                options: [
                    { label: "はい", next: "result_A_or_B" },
                    { label: "いいえ", next: "q_pension_check65" }
                ]
            },
            'q_pension_check65': {
                text: "ご自身の年齢と年金収入について当てはまるものは？",
                options: [
                    { label: "65歳以上で、年金収入が148万円以下", next: "result_D" },
                    { label: "65歳未満で、年金収入が98万円以下", next: "result_D" },
                    { label: "上記以外（基準を超える）", next: "result_B_or_A" }
                ]
            },

            // --- ④ 主に営業・農業・不動産・業務委託（自由入力ステップ） ---
            'q_biz_input_step': {
                text: "④ 事業・業務委託の収入と経費を入力してください（未入力でも下のボタンから進めます）",
                isBizInput: true, // 収入・経費の入力ボックスを表示するフラグ
                options: [
                    { label: "金額を入力せずに進む場合はこちら", next: "result_biz_default" }
                ]
            },

            // --- 結果ノード ---
            'result_A': { isResult: true, title: "【結果 A】所得税の確定申告が必要です", desc: "給与が2000万超、または副業所得が20万円を超えるなど、原則として税務署への確定申告が必要です。" },
            'result_B': { isResult: true, title: "【結果 B】住民税の申告が必要な場合があります", desc: "所得税の確定申告が不要な金額（20万円以下など）であっても、住民税には20万円以下の免除ルールがないため市区町村への申告が必要になる場合があります。" },
            'result_A_or_B': { isResult: true, title: "【結果 A or B】申告の確認が必要です", desc: "年金からの天引き状況や各種所得額によって、確定申告または住民税の申告を行います。" },
            'result_C': { isResult: true, title: "【結果 C】税金の申告が必要になる場合があります", desc: "ご自身の収入や状況に合わせて、市区町村や税務署の窓口で確認しましょう。" },
            'result_D_fuyo': { isResult: true, title: "【結果 D】控除の追加や扶養の確認", desc: "親族の扶養に入りながら、ご自身の控除（勤労学生控除など）が追加できるか確認してみましょう。" },
            'result_D': { isResult: true, title: "【結果 D】控除の追加が使える可能性があります", desc: "各種控除の追加適用を受けられる要件に該当していないか確認しましょう。" },
            
            'result_A_side_biz': { isResult: true, title: "【副業・業務委託：所得20万円超】", desc: "所得税の確定申告が必要です。また、住民税の申告も自動的に連動します。経費の領収書を整理しておきましょう。" },
            'result_B_resident_only': { isResult: true, title: "【副業・業務委託：所得20万円以下】", desc: "所得税の確定申告は原則不要ですが、**住民税は申告が必要**です。" },
            'result_stock_with_tax': { isResult: true, title: "【株の利益：特定口座（源泉徴収あり）】", desc: "証券会社が納税を完了しているため、原則として**確定申告は不要**です。" },
            'result_A_stock_refund': { isResult: true, title: "【株の利益：還付や損益通算のための申告】", desc: "確定申告をすることで、損失の繰越控除や還付を受けられる可能性があります（要確定申告）。" },
            
            'result_biz_default': { isResult: true, title: "【事業・業務委託の判定結果】", desc: "売上から経費を引いた「所得」が基礎控除額（48万円等）を超える場合は確定申告が必要です。赤字や控除以下の場合は住民税の申告等を検討しましょう。" },
            'result_biz_auto': { isResult: true, title: "【事業・業務委託：自動判定結果】", desc: "ご入力いただいた売上と経費をもとに判定しました。" },

            'result_no_tax_need': { isResult: true, title: "【判定：申告・手続きの必要性なし（目安）】", desc: "年末調整が正しく行われており、他に所得がなければ、追加の確定申告は原則不要です。" },

            'result_stu_low': { isResult: true, title: "【学生・給与 110万円以下】", desc: "住民税の非課税ライン等に収まる範囲です。" },
            'result_stu_mid1': { isResult: true, title: "【学生・給与 110万〜134万円】", desc: "住民税の控除対象となるゾーンです。勤労学生控除の適用を検討しましょう。" },
            'result_stu_mid2': { isResult: true, title: "【学生・給与 134万〜163万円】", desc: "勤労学生控除のメリットをしっかり受けられるゾーンです。JASSO奨学金の支援区分判定に影響する場合があるため要チェックです。" },
            'result_stu_high': { isResult: true, title: "【学生・給与 163万円以上】", desc: "163万円の目安や、親の健康保険・税法上の扶養基準が変わるラインです。" }
        };

        // 画面切り替え（履歴をスタックに積む）
        window.selectOption = function(nextStepKey) {
            historyStack.push(currentActiveStep);
            showStep(nextStepKey, true);
        }

        let currentActiveStep = 'q1';

        function showStep(stepKey, saveHistory = true) {
            currentActiveStep = stepKey;
            if (saveHistory) {
                saveToCloud('currentStep', stepKey);
                saveToCloud('history', historyStack);
            }

            const step = quizTree[stepKey] || quizTree['q1'];
            const questionEl = document.getElementById('question-text');
            const optionsEl = document.getElementById('options-container');
            const inputContainer = document.getElementById('input-container');
            const bizInputContainer = document.getElementById('biz-input-container');
            const inputLabel = document.getElementById('input-label');
            const resultContainer = document.getElementById('result-container');
            const resultContent = document.getElementById('result-content');
            const backBtn = document.getElementById('back-btn');

            // 戻るボタンの表示・非表示切替
            if (historyStack.length > 0) {
                backBtn.classList.remove('hidden');
            } else {
                backBtn.classList.add('hidden');
            }

            optionsEl.innerHTML = '';
            inputContainer.classList.add('hidden');
            bizInputContainer.classList.add('hidden');

            if (step.isResult) {
                questionEl.innerText = "診断が完了しました！";
                resultContainer.classList.remove('hidden');
                
                let extraMsg = "";
                if (userAnswers.userAnnualIncome) {
                    extraMsg += `<p class="mt-2 text-xs text-indigo-600 font-semibold">※入力された年収: ${Number(userAnswers.userAnnualIncome).toLocaleString()}円</p>`;
                }
                if (userAnswers.bizIncome !== undefined && userAnswers.bizExpense !== undefined) {
                    const profit = userAnswers.bizIncome - userAnswers.bizExpense;
                    extraMsg += `<p class="mt-2 text-xs text-indigo-600 font-semibold">※入力された事業所得: 売上 ${Number(userAnswers.bizIncome).toLocaleString()}円 - 経費 ${Number(userAnswers.bizExpense).toLocaleString()}円 ＝ 所得 ${profit.toLocaleString()}円</p>`;
                }
                resultContent.innerHTML = `<strong class="text-base text-indigo-900 block mb-1">${step.title}</strong>${step.desc}${extraMsg}`;
            } else {
                resultContainer.classList.add('hidden');
                questionEl.innerText = step.text;

                // 事業・業務委託の収入・経費入力ステップの場合
                if (step.isBizInput) {
                    bizInputContainer.classList.remove('hidden');
                    if (userAnswers.bizIncome !== undefined) document.getElementById('biz-income-input').value = userAnswers.bizIncome;
                    if (userAnswers.bizExpense !== undefined) document.getElementById('biz-expense-input').value = userAnswers.bizExpense;
                }

                // 学生などの自由入力ステップの場合
                if (step.inputType) {
                    inputContainer.classList.remove('hidden');
                    inputLabel.innerText = step.inputLabel;
                    if (userAnswers.userAnnualIncome) {
                        document.getElementById('custom-number-input').value = userAnswers.userAnnualIncome;
                    }
                }

                step.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/50 transition font-medium text-slate-700 shadow-sm";
                    btn.innerText = opt.label;
                    btn.onclick = () => selectOption(opt.next);
                    optionsEl.appendChild(btn);
                });
            }
        }

        // ひとつ前の質問に戻る関数
        window.goBack = function() {
            if (historyStack.length > 0) {
                const prevStep = historyStack.pop();
                showStep(prevStep, true);
            }
        }

        window.submitCustomInput = function() {
            const val = document.getElementById('custom-number-input').value;
            if (val) {
                saveToCloud('userAnnualIncome', Number(val));
            }
            selectOption('result_stu_mid2');
        }

        // 事業・業務委託の自動判定送信
        window.submitBizInputs = function() {
            const incomeVal = document.getElementById('biz-income-input').value;
            const expenseVal = document.getElementById('biz-expense-input').value;
            
            const income = incomeVal ? Number(incomeVal) : 0;
            const expense = expenseVal ? Number(expenseVal) : 0;
            const profit = income - expense;

            saveToCloud('bizIncome', income);
            saveToCloud('bizExpense', expense);

            // 基礎控除（今年基準で48万円超かどうかで自動判定）
            let nextKey = 'result_biz_default';
            if (incomeVal !== "" || expenseVal !== "") {
                if (profit > 480000) {
                    // 所得が基礎控除48万円を超える場合
                    quizTree['result_biz_auto_dynamic'] = { 
                        isResult: true, 
                        title: "【事業・業務委託：自動判定（所得48万円超）】",
