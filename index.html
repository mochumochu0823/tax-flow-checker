<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>確定申告サクッとナビ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl p-6 md:p-8">
        <!-- ヘッダー -->
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h1 class="text-xl font-bold text-indigo-600">確定申告サクッとナビ</h1>
            </div>
            <div class="flex items-center gap-2">
                <!-- 戻るボタン -->
                <button id="back-btn" onclick="goBack()" class="text-xs px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition hidden">← 戻る</button>
                <span id="auth-status" class="text-xs px-2 py-1 bg-amber-100 text-amber-800 rounded-full">接続中...</span>
            </div>
        </div>

        <!-- 質問コンテナ -->
        <div id="quiz-container">
            <div id="question-text" class="text-lg font-medium mb-6">読み込み中...</div>
            
            <!-- ① 事業・業務委託用の入力フィールド -->
            <div id="biz-input-container" class="mb-6 hidden space-y-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                <p class="text-xs text-slate-500 font-medium">売上・経費、および青色申告の状況を入力すると、自動で税金と申告方法を判定します。</p>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">税務署に「開業届」や「青色申告承認申請書」を出していますか？</label>
                    <select id="biz-type-select" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white">
                        <option value="blue">出している（青色申告をしている）</option>
                        <option value="white">出していない（白色申告、またはわからない）</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">年間売上・収入（円）</label>
                    <input type="number" id="biz-income-input" placeholder="例: 1200000" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">年間経費（円）</label>
                    <input type="number" id="biz-expense-input" placeholder="例: 300000" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white">
                </div>
                <button onclick="submitBizInputs()" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">この金額で自動判定して次へ</button>
            </div>

            <!-- ② 学生の給与収入などの自由入力フィールド -->
            <div id="input-container" class="mb-6 hidden">
                <label id="input-label" class="block text-sm font-medium text-slate-600 mb-2"></label>
                <div class="flex gap-2">
                    <input type="number" id="custom-number-input" placeholder="例: 1300000" class="flex-1 p-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="submitCustomInput()" class="bg-indigo-600 text-white px-5 py-3 rounded-xl hover:bg-indigo-700 font-medium transition">次へ</button>
                </div>
                <p class="text-xs text-slate-400 mt-1">※空欄のままでも進めます</p>
            </div>

            <!-- ③ 副業所得（20万円判定）用の自由入力フィールド -->
            <div id="side-biz-input-container" class="mb-6 hidden space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                <p class="text-xs text-slate-500 font-medium">副業の年間売上と経費を入力すると、所得（利益）を自動計算して20万円超か判定します（未入力でも下のボタンで進めます）</p>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">副業の年間売上（円）</label>
                    <input type="number" id="side-income-input" placeholder="例: 350000" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">副業の年間経費（円）</label>
                    <input type="number" id="side-expense-input" placeholder="例: 50000" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white">
                </div>
                <button onclick="submitSideBizInputs()" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">この金額で判定して次へ</button>
            </div>

            <!-- 選択肢ボタンコンテナ -->
            <div id="options-container" class="space-y-3">
                <!-- 動的にボタンが生成されます -->
            </div>
        </div>

        <!-- やり直しボタン -->
        <div class="mt-8 text-center">
            <button onclick="resetQuiz()" class="text-sm text-slate-400 hover:text-slate-600 underline">最初からやり直す</button>
        </div>

        <!-- 結果表示エリア -->
        <div id="result-container" class="mt-8 p-4 bg-indigo-50 rounded-xl border border-indigo-100 hidden">
            <h2 class="text-sm font-bold text-indigo-700 uppercase tracking-wider mb-1">診断結果・アドバイス</h2>
            <div id="result-content" class="text-slate-700 text-sm leading-relaxed"></div>
            
            <!-- 回答内容の確認＆修正エリア -->
            <div id="summary-section" class="mt-4 pt-4 border-t border-indigo-200">
                <h3 class="text-xs font-bold text-indigo-900 uppercase tracking-wider mb-2">📋 あなたの回答内容（クリックして修正できます）</h3>
                <div id="answer-summary-list" class="space-y-1.5 text-xs text-slate-700 mb-4"></div>
            </div>

            <!-- サポート・アクションセクション -->
            <div id="support-section" class="mt-4 pt-4 border-t border-indigo-200 hidden">
                <h3 class="text-xs font-bold text-indigo-900 uppercase tracking-wider mb-2">💡 この後の進め方・やることチェックリスト</h3>
                <ul id="support-checklist" class="space-y-2 text-xs text-slate-700 mb-4"></ul>
                <div id="support-action-btn" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDduIy-yScms9PIhzYL_xELUENCtxhJLgo",
            authDomain: "kakueisinnkoku.firebaseapp.com",
            projectId: "kakueisinnkoku",
            storageBucket: "kakueisinnkoku.firebasestorage.app",
            messagingSenderId: "816689506261",
            appId: "1:816689506261:web:1b4802d9345ba83e97bf5c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserUid = null;
        let userAnswers = {};
        let historyStack = [];

        signInAnonymously(auth)
            .then((userCredential) => {
                currentUserUid = userCredential.user.uid;
                document.getElementById('auth-status').innerText = "クラウド保存有効";
                document.getElementById('auth-status').className = "text-xs px-2 py-1 bg-emerald-100 text-emerald-800 rounded-full";
                loadUserData(currentUserUid);
            })
            .catch((error) => {
                console.error("認証エラー:", error);
                document.getElementById('auth-status').innerText = "オフラインモード";
                showStep('q1', false);
            });

        async function saveToCloud() {
            if (!currentUserUid) return;
            try {
                const docRef = doc(db, "tax_diagnosis", currentUserUid);
                await setDoc(docRef, {
                    answers: userAnswers,
                    history: historyStack,
                    currentStep: currentActiveStep,
                    updatedAt: new Date()
                }, { merge: true });
            } catch (e) {
                console.error("保存失敗: ", e);
            }
        }

        async function loadUserData(uid) {
            try {
                const docRef = doc(db, "tax_diagnosis", uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.answers) userAnswers = data.answers;
                    if (data.history) historyStack = data.history;
                    if (data.currentStep) {
                        currentActiveStep = data.currentStep;
                    }
                }
            } catch (e) {
                console.error("ロード失敗:", e);
            }
            showStep(currentActiveStep || 'q1', false);
        }

        // 質問ツリー定義（すべてのルートで最後に必ず共通の扶養確認へ流れるように設定）
        const quizTree = {
            'q1': {
                text: "あなたの主な収入はどれですか？",
                options: [
                    { label: "収入なし", next: "q_fuyo_check_root" },
                    { label: "主に給与 (アルバイト・正社員など)", next: "q_salary_1" },
                    { label: "主に公的年金", next: "q_pension_1" },
                    { label: "主に営業・農業・不動産・業務委託・フリーランス", next: "q_biz_input_step" }
                ]
            },

            // 共通の扶養確認ステップ
            'q_fuyo_check_root': {
                text: "現在、親や家族の「扶養（税金の扶養・健康保険の扶養）」に入っていますか？",
                options: [
                    { label: "はい（親の扶養に入っている）", next: "result_fuyo_general" },
                    { label: "いいえ（入っていない・自分ひとりの立場）", next: "result_nofuyo_general" }
                ]
            },

            // --- ② 主に給与ルート ---
            'q_salary_1': {
                text: "給与の年間収入が2,000万円を超えていますか？",
                options: [
                    { label: "はい", next: "result_A_over20m" },
                    { label: "いいえ", next: "q_salary_2" }
                ]
            },
            'q_salary_2': {
                text: "勤務先は1か所のみで、年末調整をしていますか？（複数あっても年末調整で合算している場合は「はい」）",
                options: [
                    { label: "はい", next: "q_salary_3" },
                    { label: "いいえ", next: "result_A" }
                ]
            },
            'q_salary_3': {
                text: "給与・退職所得以外の所得（副業の業務委託や、株の利益など）がありますか？",
                options: [
                    { label: "はい", next: "q_side_income_type" },
                    { label: "いいえ", next: "q_is_student" }
                ]
            },

            'q_side_income_type': {
                text: "給与以外にある「副業の業務委託」や「株の利益」について当てはまるものは？",
                options: [
                    { label: "副業の業務委託（ライティング・開発など）の所得がある", next: "q_salary_4_biz" },
                    { label: "株の売却益や配当などの投資利益がある", next: "q_stock_check" },
                    { label: "両方ある、またはその他の所得がある", next: "q_salary_4" }
                ]
            },

            'q_salary_4_biz': {
                text: "副業（業務委託）の年間所得（収入から経費を引いた額）が 20万円 を超えていますか？",
                isSideBizInput: true,
                options: [
                    { label: "はい（20万円超 → 確定申告が必要）", next: "result_A_side_biz" },
                    { label: "いいえ（20万円以下 → 所得税は不要ですが住民税申告に注意）", next: "q_fuyo_check_root" }
                ]
            },

            // 株の取引：特定口座（源泉徴収あり）を選んだ場合も、ここに立ち寄ってから結果へ進むよう修正
            'q_stock_check': {
                text: "株の取引をしている証券口座の種類や状況は？",
                options: [
                    { label: "特定口座（源泉徴収あり）である", next: "q_fuyo_check_root" },
                    { label: "特定口座（源泉徴収なし）または一般口座である", next: "result_A" },
                    { label: "損益通算や損失の繰越控除、配当控除を受けたい", next: "result_A_stock_refund" }
                ]
            },

            'q_salary_4': {
                text: "給与所得以外の各種所得の合計が 20万円 を超えていますか？",
                options: [
                    { label: "はい", next: "result_A" },
                    { label: "いいえ", next: "q_fuyo_check_root" }
                ]
            },

            'q_is_student': {
                text: "あなたは現在、学生ですか？",
                options: [
                    { label: "はい（学生です）", next: "q_student_amount" },
                    { label: "いいえ（学生ではありません）", next: "q_fuyo_check_root" }
                ]
            },

            'q_student_amount': {
                text: "あなたの現在の年間給与収入はおよそいくらですか？",
                inputType: "annualIncome",
                inputLabel: "年間給与収入（円）の入力",
                options: [
                    { label: "110万円以下", next: "q_fuyo_check_root" },
                    { label: "110万〜134万円", next: "q_fuyo_check_root" },
                    { label: "134万〜163万円（※R8改正の学生控除上限内）", next: "q_fuyo_check_root" },
                    { label: "163万円超（扶養や健康保険に注意）", next: "result_stu_high" }
                ]
            },

            // --- ③ 主に公的年金ルート ---
            'q_pension_1': {
                text: "年金収入が400万円を超えていますか？",
                options: [
                    { label: "はい", next: "result_A" },
                    { label: "いいえ", next: "q_pension_2" }
                ]
            },
            'q_pension_2': {
                text: "年金以外の所得がありますか？",
                options: [
                    { label: "はい", next: "q_pension_3" },
                    { label: "いいえ", next: "q_pension_check65" }
                ]
            },
            'q_pension_3': {
                text: "年金以外の所得が20万円を超えていますか？",
                options: [
                    { label: "はい", next: "result_A_or_B" },
                    { label: "いいえ", next: "q_pension_check65" }
                ]
            },
            'q_pension_check65': {
                text: "ご自身の年齢と年金収入について当てはまるものは？",
                options: [
                    { label: "65歳以上で、年金収入が148万円以下", next: "result_D" },
                    { label: "65歳未満で、年金収入が98万円以下", next: "result_D" },
                    { label: "上記以外（基準を超える）", next: "q_fuyo_check_root" }
                ]
            },

            'q_biz_input_step': {
                text: "事業・業務委託の売上や経費を入力してください（未入力でも進めます）",
                isBizInput: true,
                options: [
                    { label: "金額を入力せずに進む場合はこちら", next: "q_fuyo_check_root" }
                ]
            },

            // --- 結果ノード ---
            'result_A': { isResult: true, needHelp: true, helpType: "general_tax_return", title: "【判定：確定申告が【必要】です】", desc: "<strong>■ 確定申告の要否:</strong> 必要（所得税の申告を行います）<br><strong>■ 住民税について:</strong> 確定申告のデータが自動で市区町村に連動するため、別途の住民税申告は原則不要です。" },
            'result_A_over20m': { isResult: true, needHelp: true, helpType: "general_tax_return", title: "【判定：確定申告が【必要】です（給与2,000万円超）】", desc: "<strong>■ 確定申告の要否:</strong> 給与収入が2,000万円を超えるため、必ず確定申告が必要です。" },
            'result_B': { isResult: true, title: "【判定：住民税の申告に注意】", desc: "<strong>■ 確定申告の要否:</strong> 所得税の確定申告は原則不要です。<br><strong>■ 住民税について:</strong> 市区町村窓口で住民税の申告が必要な場合があります。" },
            'result_A_or_B': { isResult: true, title: "【判定：申告の確認が必要です】", desc: "<strong>■ 確定申告の要否:</strong> 状況により確定申告または住民税申告が必要です。" },
            'result_C': { isResult: true, title: "【判定：税務署や役場での確認を推奨】", desc: "<strong>■ 確定申告の要否:</strong> 税務署や役場へご確認ください。" },
            'result_D_fuyo': { isResult: true, title: "【判定：扶養内・申告不要の目安】", desc: "<strong>■ 確定申告の要否:</strong> 不要です。" },
            'result_D': { isResult: true, title: "【判定：控除の追加が使える可能性】", desc: "<strong>■ 確定申告の要否:</strong> 控除追加の申告で還付を受けられる場合があります。" },
            
            'result_A_side_biz': { isResult: true, needHelp: true, helpType: "biz_side_job", title: "【判定：確定申告が【必要】です（副業・業務委託）】", desc: "<strong>■ 確定申告の要否:</strong> 必要（副業の所得が20万円を超えているため）<br><strong>■ 住民税について:</strong> 確定申告に連動します。<br><strong>■ 家族の扶養への影響:</strong> 利益が大きいため親の扶養（税法上・健康保険）から外れる可能性が高いです。" },
            'result_A_stock_refund': { isResult: true, needHelp: true, helpType: "stock_refund", title: "【判定：還付・損失繰越のための申告が【必要】です】", desc: "<strong>■ 確定申告の要否:</strong> 必要（損益通算や還付を受けるため）" },
            
            'result_stu_high': { isResult: true, title: "【判定：確認が必要なラインです】", desc: "<strong>■ 確定申告の要否:</strong> 収入状況により確認が必要です。<br><strong>■ 家族の扶養・住民税について:</strong> 基準を超えるため親の扶養から外れる可能性があります。" },

            // 扶養確認を経由した着地点（株の源泉徴収ありや、給与のみで申告不要なケースなど）
            'result_fuyo_general': { isResult: true, title: "【判定：確定申告の義務は原則【不要】（親の扶養内）】", desc: "<strong>■ 確定申告の要否:</strong> 基準内の収入であれば確定申告の義務はありません。<br><strong>■ 家族の扶養への影響:</strong> 親の税法上の扶養・健康保険の扶養の範囲内に収まっているため安心です。<br><strong>■ 住民税について:</strong> アルバイト等の給与や非課税枠内であれば、勤務先からの報告書が自動で市区町村にいくため個人の手続きは不要です。" },
            'result_nofuyo_general': { isResult: true, title: "【判定：確定申告の義務は原則【不要】（単身・扶養なし）】", desc: "<strong>■ 確定申告の要否:</strong> 基準内の収入であれば確定申告は不要です。<br><strong>■ 住民税について:</strong> 非課税枠内であれば住民税はかかりません。特段のお手続きも不要です。" },
            'result_biz_auto_dynamic': {
                isResult: true,
                needHelp: true,
                helpType: "biz_side_job",
                title: "【判定：事業所得が48万円を超えるため確定申告が【必要】です】",
                desc: "<strong>■ 確定申告の要否:</strong> 必要（所得が48万円を超えているため）<br><strong>■ 住民税について:</strong> 確定申告の内容が市区町村へ連動します。<br><strong>■ 家族の扶養への影響:</strong> 所得額によっては扶養から外れる可能性があります。"
            }
        };

        window.selectOption = function(nextStepKey, selectedLabel = "") {
            if (selectedLabel) {
                userAnswers[currentActiveStep] = { label: selectedLabel, next: nextStepKey };
            }
            historyStack.push(currentActiveStep);
            showStep(nextStepKey, true);
        }

        let currentActiveStep = 'q1';

        function showStep(stepKey, saveHistory = true) {
            currentActiveStep = stepKey;
            if (saveHistory) {
                saveToCloud();
            }

            const step = quizTree[stepKey] || quizTree['q1'];
            const questionEl = document.getElementById('question-text');
            const optionsEl = document.getElementById('options-container');
            const inputContainer = document.getElementById('input-container');
            const bizInputContainer = document.getElementById('biz-input-container');
            const sideBizInputContainer = document.getElementById('side-biz-input-container');
            const inputLabel = document.getElementById('input-label');
            const resultContainer = document.getElementById('result-container');
            const resultContent = document.getElementById('result-content');
            const summarySection = document.getElementById('summary-section');
            const answerSummaryList = document.getElementById('answer-summary-list');
            const supportSection = document.getElementById('support-section');
            const supportChecklist = document.getElementById('support-checklist');
            const supportActionBtn = document.getElementById('support-action-btn');
            const backBtn = document.getElementById('back-btn');

            if (historyStack.length > 0) {
                backBtn.classList.remove('hidden');
            } else {
                backBtn.classList.add('hidden');
            }

            optionsEl.innerHTML = '';
            inputContainer.classList.add('hidden');
            bizInputContainer.classList.add('hidden');
            sideBizInputContainer.classList.add('hidden');

            if (step.isResult) {
                questionEl.innerText = "診断が完了しました！";
                resultContainer.classList.remove('hidden');
                summarySection.classList.remove('hidden');
                
                let extraMsg = "";
                if (userAnswers.userAnnualIncome) {
                    extraMsg += `<p class="mt-2 text-xs text-indigo-600 font-semibold">※入力された年収: ${Number(userAnswers.userAnnualIncome).toLocaleString()}円</p>`;
                }
                if (userAnswers.bizIncome !== undefined && userAnswers.bizExpense !== undefined) {
                    const profit = userAnswers.bizIncome - userAnswers.bizExpense;
                    const taxTypeLabel = userAnswers.bizType === 'blue' ? '青色申告' : '白色申告';
                    extraMsg += `<p class="mt-2 text-xs text-indigo-600 font-semibold">※申告方式: ${taxTypeLabel} / 売上 ${Number(userAnswers.bizIncome).toLocaleString()}円 - 経費 ${Number(userAnswers.bizExpense).toLocaleString()}円 ＝ 所得 ${profit.toLocaleString()}円</p>`;
                }
                if (userAnswers.sideIncome !== undefined && userAnswers.sideExpense !== undefined) {
                    const profit = userAnswers.sideIncome - userAnswers.sideExpense;
                    extraMsg += `<p class="mt-2 text-xs text-indigo-600 font-semibold">※副業所得: 売上 ${Number(userAnswers.sideIncome).toLocaleString()}円 - 経費 ${Number(userAnswers.sideExpense).toLocaleString()}円 ＝ 所得 ${profit.toLocaleString()}円</p>`;
                }
                resultContent.innerHTML = `<strong class="text-base text-indigo-900 block mb-2">${step.title}</strong><p class="mb-2 leading-relaxed">${step.desc}</p>${extraMsg}`;

                answerSummaryList.innerHTML = "";
                for (let [stepKey, data] of Object.entries(userAnswers)) {
                    if (stepKey === 'currentStep' || stepKey === 'history') continue;
                    const qObj = quizTree[stepKey];
                    if (qObj && qObj.text) {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = "flex justify-between items-center bg-white p-2 rounded border border-indigo-100 shadow-xs";
                        itemDiv.innerHTML = `
                            <span class="truncate pr-2 text-slate-600"><strong>Q:</strong> ${qObj.text.substring(0, 25)}... → <span class="text-indigo-600 font-medium">${data.label}</span></span>
                            <button onclick="jumpToStep('${stepKey}')" class="text-xs bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-2 py-1 rounded transition shrink-0">修正する</button>
                        `;
                        answerSummaryList.appendChild(itemDiv);
                    }
                }

                if (step.needHelp) {
                    supportSection.classList.remove('hidden');
                    supportChecklist.innerHTML = "";
                    supportActionBtn.innerHTML = "";

                    let checklistItems = [
                        "① 源泉徴収票や売上・経費の記録をまとめる",
                        "② マイナンバーカードを準備する",
                        "③ 国税庁の「確定申告書作成コーナー」へアクセスする",
                        "④ 画面に従って入力し、送信または提出する"
                    ];

                    checklistItems.forEach(item => {
                        const li = document.createElement('li');
                        li.className = "flex items-start gap-1.5";
                        li.innerHTML = `<span class="text-indigo-600 font-bold">✓</span> ${item}`;
                        supportChecklist.appendChild(li);
                    });

                    const linkBtn = document.createElement('a');
                    linkBtn.href = "https://www.keisan.nta.go.jp/kyoutu/ky/sm/top_web#bsctrl";
                    linkBtn.target = "_blank";
                    linkBtn.className = "block w-full text-center bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg text-xs font-bold transition shadow-sm";
                    linkBtn.innerText = "🌐 国税庁 確定申告書作成コーナーを開く (外部サイト)";
                    supportActionBtn.appendChild(linkBtn);
                } else {
                    supportSection.classList.add('hidden');
                }

            } else {
                resultContainer.classList.add('hidden');
                summarySection.classList.add('hidden');
                supportSection.classList.add('hidden');
                questionEl.innerText = step.text;

                if (step.isBizInput) {
                    bizInputContainer.classList.remove('hidden');
                    if (userAnswers.bizIncome !== undefined) document.getElementById('biz-income-input').value = userAnswers.bizIncome;
                    if (userAnswers.bizExpense !== undefined) document.getElementById('biz-expense-input').value = userAnswers.bizExpense;
                    if (userAnswers.bizType) document.getElementById('biz-type-select').value = userAnswers.bizType;
                }

                if (step.isSideBizInput) {
                    sideBizInputContainer.classList.remove('hidden');
                    if (userAnswers.sideIncome !== undefined) document.getElementById('side-income-input').value = userAnswers.sideIncome;
                    if (userAnswers.sideExpense !== undefined) document.getElementById('side-expense-input').value = userAnswers.sideExpense;
                }

                if (step.inputType) {
                    inputContainer.classList.remove('hidden');
                    inputLabel.innerText = step.inputLabel;
                    if (userAnswers.userAnnualIncome) {
                        document.getElementById('custom-number-input').value = userAnswers.userAnnualIncome;
                    }
                }

                const prevAnswer = userAnswers[stepKey];
                step.options.forEach(opt => {
                    const btn = document.createElement('button');
                    let isPreviouslySelected = prevAnswer && prevAnswer.next === opt.next;
                    
                    if (isPreviouslySelected) {
                        btn.className = "w-full text-left p-4 rounded-xl border-2 border-indigo-300 bg-indigo-50/80 hover:border-indigo-500 transition font-medium text-indigo-900 shadow-sm relative";
                        btn.innerHTML = `${opt.label} <span class="absolute right-4 text-xs bg-indigo-200 text-indigo-800 px-2 py-0.5 rounded-full">前回の回答</span>`;
                    } else {
                        btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/50 transition font-medium text-slate-700 shadow-sm";
                        btn.innerText = opt.label;
                    }

                    btn.onclick = () => selectOption(opt.next, opt.label);
                    optionsEl.appendChild(btn);
                });
            }
        }

        window.goBack = function() {
            if (historyStack.length > 0) {
                const prevStep = historyStack.pop();
                showStep(prevStep, true);
            }
        }

        window.jumpToStep = function(stepKey) {
    const stepIndex = historyStack.indexOf(stepKey);

    if (stepIndex !== -1) {
        const laterSteps = historyStack.slice(stepIndex + 1);

        laterSteps.forEach(key => {
            delete userAnswers[key];
        });

        historyStack = historyStack.slice(0, stepIndex);
    }

    delete userAnswers[stepKey];

    showStep(stepKey, true);
}

        window.submitCustomInput = function() {
            const val = document.getElementById('custom-number-input').value;
            if (val) {
                userAnswers['userAnnualIncome'] = Number(val);
            }
            selectOption('q_fuyo_check_root', `年間給与収入: ${Number(val).toLocaleString()}円`);
        }

        window.submitSideBizInputs = function() {
            const incomeVal = document.getElementById('side-income-input').value;
            const expenseVal = document.getElementById('side-expense-input').value;
            
            const income = incomeVal ? Number(incomeVal) : 0;
            const expense = expenseVal ? Number(expenseVal) : 0;
            const profit = income - expense;

            userAnswers['sideIncome'] = income;
            userAnswers['sideExpense'] = expense;

            let nextKey = 'q_fuyo_check_root';
            let labelStr = "金額未入力で進む";

            if (incomeVal !== "" || expenseVal !== "") {
                if (profit > 200000) {
                    nextKey = 'result_A_side_biz';
                    labelStr = `売上${income.toLocaleString()}円-経費${expense.toLocaleString()}円＝所得${profit.toLocaleString()}円（20万円超）`;
                } else {
                    nextKey = 'q_fuyo_check_root';
                    labelStr = `売上${income.toLocaleString()}円-経費${expense.toLocaleString()}円＝所得${profit.toLocaleString()}円（20万円以下）`;
                }
            }

            userAnswers[currentActiveStep] = { label: labelStr, next: nextKey };
            historyStack.push(currentActiveStep);
            showStep(nextKey, true);
        }

        window.submitBizInputs = function() {
            const bizType = document.getElementById('biz-type-select').value;
            const incomeVal = document.getElementById('biz-income-input').value;
            const expenseVal = document.getElementById('biz-expense-input').value;
            
            const income = incomeVal ? Number(incomeVal) : 0;
            const expense = expenseVal ? Number(expenseVal) : 0;
            const profit = income - expense;

            userAnswers['bizType'] = bizType;
            userAnswers['bizIncome'] = income;
            userAnswers['bizExpense'] = expense;

            let nextKey = 'q_fuyo_check_root';
            if (incomeVal !== "" || expenseVal !== "") {
                if (profit > 480000) {
                    nextKey = 'result_biz_auto_dynamic';
                } else {
                    nextKey = 'q_fuyo_check_root';
                }
            }

            userAnswers[currentActiveStep] = { label: `事業入力（所得: ${profit.toLocaleString()}円）`, next: nextKey };
            historyStack.push(currentActiveStep);
            showStep(nextKey, true);
        }

        window.resetQuiz = function() {
            userAnswers = {};
            historyStack = [];
            saveToCloud();
            showStep('q1', true);
        }
    </script>
</body>
</html>
